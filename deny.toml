# cargo-deny configuration (style guide §12). Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Every advisory fails the check unless it is listed here with a reason.
version = 2
yanked = "deny"
# Each entry needs a reason and is re-examined when the crate that pulls it in is implemented.
# Every entry below was re-checked on 2026-11-13 (wave 3) against the lock file and the newest
# releases: each advisory still matches a crate in Cargo.lock (cargo deny reports none as
# unmatched), and no upgrade available today removes it. openmls_rust_crypto 0.6.0 (latest)
# still pins hpke-rs 0.7 and hpke-rs-rust-crypto 0.7 although 0.8 exists; rln 3.1.0 (latest)
# still pins arkworks 0.5 although 0.6 exists; uniffi 0.32.2 is the latest uniffi.
# RUSTSEC-2026-0329, -0330 and -0331 (libcrux-hmac-drbg 0.0.1, libcrux-kem 0.0.9, pinned under
# openmls_libcrux_crypto 0.4 for pingers-mls feature x-wing) are not ignored: the upstream fixes
# are backported into vendor/libcrux-* at the pinned versions ([patch.crates-io], PINGERS.md).
ignore = [
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 timing issues: via p256 in hpke-rs-rust-crypto 0.7 (openmls_rust_crypto 0.6, which has no release on 0.8). pingers-mls runs only suite 0x0003 (and 0x004D with x-wing), and parse_key_package refuses any other suite before OpenMLS verifies a signature, so no P-256 code runs; the inputs would be public anyway." },
  # rln entries, re-checked with pingers-anon implemented. sled cannot be removed:
  # rln 3.x lists it as a non-optional dependency for every non-wasm target (with the
  # `compression` feature that pulls zstd-safe 4), and every zerokit_utils release does the same,
  # so no feature set or older rln avoids it. pingers-anon never constructs rln's PmTree (it has
  # its own in-memory tree), so no sled code is reachable from Pingers.
  { id = "RUSTSEC-2025-0055", reason = "tracing-subscriber 0.2: via ark-relations' `std` feature, which rln forces on; nothing in Pingers installs a subscriber through it. No fix in arkworks 0.5." },
  { id = "RUSTSEC-2026-0403", reason = "zstd-safe 4: via rln's unconditional sled (feature `compression`); sled is unreachable from pingers-anon, so no zstd input is ever decoded." },
  { id = "RUSTSEC-2024-0388", reason = "derivative unmaintained: via rln (arkworks 0.5). No fix upstream." },
  { id = "RUSTSEC-2025-0057", reason = "fxhash unmaintained: via rln's unconditional sled, unreachable from pingers-anon. No fix upstream." },
  { id = "RUSTSEC-2024-0384", reason = "instant unmaintained: via rln's unconditional sled, unreachable from pingers-anon. No fix upstream." },
  { id = "RUSTSEC-2024-0436", reason = "paste unmaintained: a proc macro (no run-time code) used by ark-ff 0.5 under rln. No fix upstream." },
  { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 unmaintained: a proc macro (no run-time code) used by hax-lib-macros 0.3 under libcrux-sha3, under hpke-rs 0.7 (openmls_rust_crypto). No fix upstream." },
  { id = "RUSTSEC-2026-0374", reason = "basic-toml unmaintained: via askama_derive 0.16 in uniffi_bindgen 0.32.2 (latest), which renders the bindings at build time only; the shipped library parses no TOML. Re-check on the next uniffi release." },
]

[licenses]
version = 2
# Licences that may be combined with AGPL-3.0-only code. Weak copyleft (MPL-2.0) is allowed
# because it is file-scoped and GPL-compatible; hpke-rs uses it.
allow = [
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BlueOak-1.0.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "LGPL-2.1-or-later",
  "LGPL-3.0-or-later",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9
# SQLite's public-domain blessing and libtomcrypt's WTFPL, inside the bundled SQLCipher.
exceptions = [
  { crate = "sqlcipher-src", allow = ["blessing", "WTFPL"] },
]

[licenses.private]
# Our own crates are unpublished; they carry AGPL-3.0-only through the workspace.
#
# This also skips monokulo-nodo's nodo-manifest and nodo-settings (git dependencies with
# `publish = false`), so a licence exception for them could never match and cargo deny reported
# the old ones as unmatched. Checked by hand at the pinned commit (226610d, Cargo.toml): both are
# GPL-3.0-or-later, compatible with AGPL-3.0 (GPLv3 §13). They are dev-dependencies of xtask
# only, for the test that checks packaging/nodo as a device would, never in a shipped binary.
# Re-check the licence whenever the pin in the workspace Cargo.toml moves.
ignore = true

[bans]
# Duplicate versions are reported, not failed: the MLS, OHTTP and RustCrypto lines move at
# different speeds and some duplication is unavoidable. Review the list when upgrading.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# "No anyhow in our library crates" (style guide §4) is checked by `cargo xtask layers`;
# third-party crates may use it.
deny = [
  # rustls with aws-lc-rs is the TLS of record (design B.8). OpenSSL is allowed only as
  # SQLCipher's crypto library, vendored through rusqlite.
  { name = "openssl" },
  { name = "openssl-sys", wrappers = ["libsqlite3-sys"] },
  { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# nodo-manifest and nodo-settings (dev-dependencies of xtask), pinned to one commit.
allow-git = ["https://github.com/OceanEilonwy/monokulo-nodo"]
