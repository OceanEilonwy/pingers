# cargo-deny configuration (style guide §12). Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Every advisory fails the check unless it is listed here with a reason.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Licences that may be combined with AGPL-3.0-only code. Weak copyleft (MPL-2.0) is allowed
# because it is file-scoped and GPL-compatible; hpke-rs uses it.
allow = [
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "LGPL-2.1-or-later",
  "LGPL-3.0-or-later",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# Our own crates are unpublished; they carry AGPL-3.0-only through the workspace.
ignore = true

[bans]
# Duplicate versions are reported, not failed: the MLS, OHTTP and RustCrypto lines move at
# different speeds and some duplication is unavoidable. Review the list when upgrading.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # Library crates report errors as typed enums (style guide §4).
  { name = "anyhow", wrappers = ["xtask", "pingers-server", "pingers-push-relay", "pingers-ohttp-relay", "pingers-cli"] },
  # Pulls a C TLS stack; rustls with aws-lc-rs is the TLS of record (design B.8).
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
