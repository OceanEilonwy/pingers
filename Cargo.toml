[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Vendored third-party crates keep their own style and are not linted or tested as members.
exclude = ["vendor/*"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.98"
version = "0.1.0"
publish = false

# One version of each shared dependency for the whole workspace. Crates refer to
# these with `name = { workspace = true }` and add features locally if needed.
# Adding a dependency here needs a reason in the pull request (style guide §12).
[workspace.dependencies]
# Internal crates, so manifests can say `pingers-proto = { workspace = true }`.
pingers-time = { path = "crates/pingers-time" }
pingers-proto = { path = "crates/pingers-proto" }
pingers-geo = { path = "crates/pingers-geo" }
pingers-crypto = { path = "crates/pingers-crypto" }
pingers-mls = { path = "crates/pingers-mls" }
pingers-anon = { path = "crates/pingers-anon", default-features = false }
pingers-ohttp = { path = "crates/pingers-ohttp" }
pingers-presence = { path = "crates/pingers-presence", default-features = false }
pingers-meetup = { path = "crates/pingers-meetup" }
pingers-gate = { path = "crates/pingers-gate" }
pingers-store = { path = "crates/pingers-store" }
pingers-transport = { path = "crates/pingers-transport" }
pingers-parties = { path = "crates/pingers-parties" }
pingers-sync = { path = "crates/pingers-sync" }
pingers-wake = { path = "crates/pingers-wake" }
pingers-meetup-session = { path = "crates/pingers-meetup-session" }
pingers-client = { path = "crates/pingers-client" }
pingers-screens = { path = "crates/pingers-screens" }
pingers-words = { path = "crates/pingers-words" }
pingers-board-store = { path = "crates/pingers-board-store" }
pingers-mailbox = { path = "crates/pingers-mailbox" }
pingers-delivery = { path = "crates/pingers-delivery" }
pingers-quota = { path = "crates/pingers-quota" }
pingers-testkit = { path = "crates/pingers-testkit" }
pingers-map-packs = { path = "crates/pingers-map-packs" }

# Errors and secret hygiene
thiserror = "2.0.21"
zeroize = { version = "1.9.1", features = ["derive"] }
subtle = "2.6.1"

# Randomness: functions take `&mut impl rand_core::CryptoRng`; tests seed ChaCha.
rand_core = "0.10.1"
rand_chacha = "0.10.0"
# The OS entropy source, read only by composition roots (pingers-client) to seed what they pass down.
getrandom = { version = "0.4.3", features = ["sys_rng"] }

# Encoding
minicbor = { version = "2.3.1", features = ["alloc", "derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
hex = "0.4.3"

# Cryptographic primitives (called from pingers-crypto only, style guide §8)
hkdf = "0.13.0"
hmac = "0.13.0"
sha2 = "0.11.1"
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
hpke-rs = { version = "0.8.0", features = ["rustcrypto"] }
# The HPKE provider trait, so pingers-crypto can feed hpke-rs caller-supplied randomness.
hpke-rs-crypto = { version = "0.8.0", default-features = false }
# X-Wing KEM for post-quantum grant keys (pingers-crypto feature `x-wing`, design B.8).
x-wing = { version = "0.1.1", default-features = false, features = ["zeroize"] }
ed25519-dalek = { version = "3.0.0", features = ["zeroize"] }
x25519-dalek = { version = "3.0.0", features = ["zeroize", "static_secrets"] }

# MLS (pingers-mls only)
openmls = { version = "0.9.2", features = ["openmls_rust_crypto"] }
openmls_rust_crypto = "0.6.0"
openmls_traits = "0.6.0"
openmls_basic_credential = "0.6.0"
openmls_memory_storage = "0.6.0"
tls_codec = "0.5.0"

# Anonymous authorisation (pingers-anon only)
rln = { version = "3.1.0", default-features = false }
# Arithmetic on rln's BN254 scalars: canonical decoding, reduction into the field, inversion.
ark-ff = { version = "0.5.0", default-features = false }
# Privacy Pass type 0x0001 (VOPRF, P-384) is built on voprf directly: privacypass
# 0.2.0-pre.4 does not compile (its blind-rsa-signatures dependency breaks against rsa).
voprf = { version = "0.6.0-pre.2", default-features = false, features = ["alloc"] }
# The group voprf runs over for token type 0x0001 (RFC 9497 P384-SHA384).
p384 = { version = "0.14.0", default-features = false, features = ["oprf", "alloc"] }

# Oblivious HTTP (pingers-ohttp only); AES-GCM is pinned in code, not here. Vendored and
# patched (injected randomness; sans-I/O chunked OHTTP fixing ohttp issue #102): vendor/ohttp/README.md.
ohttp = { path = "vendor/ohttp" }
bhttp = "0.8.0"

# Gzip for pingers-tiles, which reads PMTiles directories and tiles (gzip by the PMTiles spec).
# Pure Rust backend (miniz_oxide); widely used and maintained by the rust-lang org.
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }

# Geometry
libm = "0.2.16"

# I/O: L2 and above only (enforced by `cargo xtask layers`)
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1.92"
hyper = { version = "1.12.0", features = ["client", "server", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio", "client-legacy", "http2"] }
# Empty and Either bodies for the local stack's TLS front (xtask; already in the tree via hyper-util).
http-body-util = "0.1.5"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
# rustls over tokio sockets for pingers-transport's HTTP/2 connections (already in the tree via reqwest).
tokio-rustls = { version = "0.26.6", default-features = false }
# Mozilla's root certificates for pingers-transport's HTTPS (CDLA-Permissive-2.0).
webpki-roots = "1.0.12"
# SQLCipher needs a crypto library; the vendored OpenSSL keeps the Android build self-contained.
rusqlite = { version = "0.42.0", features = ["bundled-sqlcipher-vendored-openssl"] }
axum = { version = "0.8.9", features = ["http2"] }
# ReaderStream, so pingers-map-host streams packs from disk (already in the tree via h2).
tokio-util = { version = "0.7.20", default-features = false, features = ["io"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json"] }
url = "2.5.8"
# RS256 for the push relay's FCM service-account JWT (RFC 7523), in pingers-crypto behind its
# `rs256` feature: a Google protocol requirement. Already in the tree as rustls's provider; it
# zeroizes keys on free.
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys"] }
# Base64url for that JWT and the service account's PEM key.
base64 = "0.23.1"
bytes = "1.12.1"
uniffi = "0.32.2"

# Binaries only (style guide §4)
anyhow = "1.0.104"

# Tests
proptest = "1.12.0"
# Self-signed certificates for TLS tests (pingers-transport).
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }

# Tooling
toml = "1.2.1"
# monokulo-nodo's own manifest and settings parsers, so a test checks packaging/nodo exactly as a
# device would. GPL-3.0-or-later (compatible with AGPL-3.0 under GPLv3 §13); dev-dependencies of
# xtask only, never in a shipped binary (`[licenses.private]` in deny.toml says how their licence
# is checked). Pinned to the monokulo-nodo main commit that merged N1 and N2 (#12), the same one
# feed.yml builds with.
nodo-manifest = { git = "https://github.com/OceanEilonwy/monokulo-nodo", rev = "4ad566128b7ce69a83a512ce435084428487b39f" }
nodo-settings = { git = "https://github.com/OceanEilonwy/monokulo-nodo", rev = "4ad566128b7ce69a83a512ce435084428487b39f" }

# Same-layer dependencies, checked by `cargo xtask layers`. The architecture puts pingers-time
# in L0 beside the crates that need its types, so L0 has an internal order:
# pingers-time, then pingers-proto, then pingers-geo and pingers-crypto.
[workspace.metadata.pingers]
same-layer = [
  { crate = "pingers-proto", dependency = "pingers-time", reason = "wire types carry Bucket and UnixSeconds (style guide §6 puts them in pingers-time)" },
  { crate = "pingers-geo", dependency = "pingers-time", reason = "fixes are timestamped and the Spot state machine counts seconds" },
  { crate = "pingers-crypto", dependency = "pingers-time", reason = "tags, seal keys and the meetup PSK are derived per Bucket" },
  { crate = "pingers-crypto", dependency = "pingers-proto", reason = "keys are derived from proto's identifiers and seal proto's records and beacons" },
  # L3: the architecture's dependency lists put these inside L3.
  { crate = "pingers-client", dependency = "pingers-parties", reason = "composition root" },
  { crate = "pingers-client", dependency = "pingers-sync", reason = "composition root" },
  { crate = "pingers-client", dependency = "pingers-wake", reason = "composition root" },
  { crate = "pingers-client", dependency = "pingers-meetup-session", reason = "composition root" },
  # L4: as fob-words reads fob-screens, the words are written from the view models.
  { crate = "pingers-words", dependency = "pingers-screens", reason = "words are written from the view models (architecture §3, L4)" },
]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Section 5: no panics
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
panic_in_result_fn = "deny"
exit = "deny"
# Sections 1, 4, 11
fn_params_excessive_bools = "deny"
missing_errors_doc = "warn"
wildcard_enum_match_arm = "warn"
allow_attributes = "deny"          # use #[expect(.., reason = "..")]
allow_attributes_without_reason = "deny"
# Section 9 and hygiene
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"

# The library as the Android app ships it, once per ABI.
# (Release builds for this machine keep symbols: UniFFI's bindgen reads them.)
[profile.android]
inherits = "release"
lto = true
codegen-units = 1
strip = true

# Tests and debug builds make real Groth16 proofs (pingers-anon, pingers-sync, pingers-quota,
# pingers-server). Unoptimised arkworks takes seconds per proof; optimising only the prover's
# arithmetic keeps the rest of the debug build as it was.
[profile.dev.package.ark-ff]
opt-level = 3
[profile.dev.package.ark-ec]
opt-level = 3
[profile.dev.package.ark-bn254]
opt-level = 3
[profile.dev.package.ark-groth16]
opt-level = 3
[profile.dev.package.ark-poly]
opt-level = 3
[profile.dev.package.ark-relations]
opt-level = 3
[profile.dev.package.ark-serialize]
opt-level = 3
[profile.dev.package.ark-std]
opt-level = 3
[profile.dev.package.rln]
opt-level = 3
[profile.dev.package.ruint]
opt-level = 3
[profile.dev.package.num-bigint]
opt-level = 3
# The prover's generic code is instantiated here (rln's backend over our hasher).
[profile.dev.package.pingers-anon]
opt-level = 3
