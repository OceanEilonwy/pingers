# Builds the signed release APK and AAB of each flavour and, for a pushed tag `v*`, publishes
# them as a GitHub Release, which is where Obtainium installs and updates the app from
# (docs/install.md). It has no manual trigger: the signing key is used only for a `v*` tag whose
# commit is on main, and both jobs that come before the key refuse anything else.
#
# Jobs:
#   version  `cargo xtask release-version <tag>`: versionName, versionCode and whether the tag
#            is a pre-release (`v1.0.0-rc.1`), refusing a malformed tag or one that does not come
#            after every other v* tag (its code would go backwards and Android would refuse it).
#   android  per flavour, `cargo xtask release-android --tag <tag>`: the same command as on a
#            developer's machine. It checks the upload key is configured and is the published
#            certificate, runs Gradle with the tag's version, fails unless every APK and AAB is
#            signed by exactly that key, and names them pingers-<version>-<flavour>.apk|.aab.
#   publish  for a pushed tag only: `cargo xtask release-notes` writes SHA256SUMS and the body
#            (notes, which APK to install, the certificate SHA-256, checksums), then `gh release
#            create` attaches both APKs, both AABs and SHA256SUMS, as a pre-release for a
#            pre-release tag. Only this job can write to the repository.
#
# Secrets (in the `release` environment, so they can be limited to tags and given reviewers):
#   PINGERS_KEYSTORE_BASE64    the upload keystore (PKCS12), base64. Decoded into a 0600 file in
#                              the runner's temp directory for this job only, then deleted.
#   PINGERS_KEYSTORE_PASSWORD  its password, which is also the key's.
#   PINGERS_KEY_ALIAS          the key's alias.
#   GOOGLE_SERVICES_JSON       Firebase's google-services.json; the gms flavour needs it.
# Variables (or secrets of the same name, if a host should not show in logs):
#   PINGERS_SERVER_HOST, PINGERS_OHTTP_RELAY, PINGERS_PUSH_RELAY, PINGERS_MAP_HOST
#                              the deployment's hosts. Unset, the app gets a .invalid host and
#                              the run warns.
#   PINGERS_GATEWAY_KEY_PINS, PINGERS_PUSH_RELAY_KEY_PINS
#                              the gateway's and push relay's key config hashes (base64url
#                              SHA-256, comma-separated: the served key and the next one), as
#                              `cargo xtask pins` prints them. Unset, the app pins on first use.
# Every name is described in android/docs/release.md.
#
# The key is in the same job as Gradle, so Gradle plugins and build dependencies run where the
# key is. They are the same pinned versions every CI run builds with.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  NDK_VERSION: 27.0.12077973
  # The tag the version comes from: always the pushed tag.
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      # Every tag, so the new one can be checked against all earlier ones.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A v* tag on a commit that is on main, or nothing: a tag pushed on a branch commit never
      # reaches the signing key. fetch-depth 0 above fetched every branch, so origin/main is here.
      - name: Refuse unless a v* tag on main
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::release runs only for a pushed tag, not $GITHUB_REF"
            exit 1
          fi
          case "$GITHUB_REF_NAME" in
            v*) ;;
            *) echo "::error::$GITHUB_REF_NAME is not a v* tag"; exit 1 ;;
          esac
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          fi

      - name: Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Version from the tag
        id: version
        run: cargo xtask release-version "$RELEASE_TAG" | tee -a "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: release
    strategy:
      fail-fast: false
      matrix:
        flavour: [foss, gms]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A v* tag on a commit that is on main, or nothing: a tag pushed on a branch commit never
      # reaches the signing key. fetch-depth 0 above fetched every branch, so origin/main is here.
      - name: Refuse unless a v* tag on main
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::release runs only for a pushed tag, not $GITHUB_REF"
            exit 1
          fi
          case "$GITHUB_REF_NAME" in
            v*) ;;
            *) echo "::error::$GITHUB_REF_NAME is not a v* tag"; exit 1 ;;
          esac
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          fi

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Rust toolchain, Android targets and the NDK
        run: |
          # rust-toolchain.toml names the version, components and targets.
          rustup toolchain install --no-self-update
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null

      # Separate keys from ci.yml's caches, so a pull request's run never writes what a release
      # restores.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-ndk
            target
          key: release-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-cargo-${{ runner.os }}-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: release-gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml', 'android/**/*.gradle.kts') }}
          restore-keys: release-gradle-${{ runner.os }}-

      - name: Install cargo-ndk
        run: command -v cargo-ndk || cargo install --locked cargo-ndk

      - name: Write google-services.json
        if: matrix.flavour == 'gms'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON is not set; a gms release without it has no FCM"
            exit 1
          fi
          file="$RUNNER_TEMP/google-services.json"
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$file"
          echo "PINGERS_GOOGLE_SERVICES_JSON=$file" >> "$GITHUB_ENV"

      # The keystore exists only from here to the clean-up step, in a 0600 file outside the
      # checkout.
      - name: Write the upload keystore
        env:
          PINGERS_KEYSTORE_BASE64: ${{ secrets.PINGERS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$PINGERS_KEYSTORE_BASE64" ]; then
            echo "::error::PINGERS_KEYSTORE_BASE64 is not set (android/docs/release.md)"
            exit 1
          fi
          umask 077
          file="$RUNNER_TEMP/upload-keystore.p12"
          printf '%s' "$PINGERS_KEYSTORE_BASE64" | base64 --decode > "$file"
          echo "PINGERS_KEYSTORE_PATH=$file" >> "$GITHUB_ENV"

      - name: Build and verify the signed release (${{ matrix.flavour }})
        env:
          FLAVOUR: ${{ matrix.flavour }}
          PINGERS_KEYSTORE_PASSWORD: ${{ secrets.PINGERS_KEYSTORE_PASSWORD }}
          PINGERS_KEY_ALIAS: ${{ secrets.PINGERS_KEY_ALIAS }}
          PINGERS_SERVER_HOST: ${{ vars.PINGERS_SERVER_HOST || secrets.PINGERS_SERVER_HOST }}
          PINGERS_OHTTP_RELAY: ${{ vars.PINGERS_OHTTP_RELAY || secrets.PINGERS_OHTTP_RELAY }}
          PINGERS_PUSH_RELAY: ${{ vars.PINGERS_PUSH_RELAY || secrets.PINGERS_PUSH_RELAY }}
          PINGERS_MAP_HOST: ${{ vars.PINGERS_MAP_HOST || secrets.PINGERS_MAP_HOST }}
          PINGERS_GATEWAY_KEY_PINS: ${{ vars.PINGERS_GATEWAY_KEY_PINS }}
          PINGERS_PUSH_RELAY_KEY_PINS: ${{ vars.PINGERS_PUSH_RELAY_KEY_PINS }}
        run: cargo xtask release-android --flavour "$FLAVOUR" --tag "$RELEASE_TAG"

      - name: Delete the keystore and google-services.json
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.p12" "$RUNNER_TEMP/google-services.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files-${{ matrix.flavour }}
          path: |
            target/release-android/pingers-${{ needs.version.outputs.version_name }}-${{ matrix.flavour }}.apk
            target/release-android/pingers-${{ needs.version.outputs.version_name }}-${{ matrix.flavour }}.aab
          retention-days: 30
          if-no-files-found: error

      # R8's mapping, to read stack traces from this build; never part of the release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mapping-${{ matrix.flavour }}
          path: android/app/build/outputs/mapping/${{ matrix.flavour }}Release/mapping.txt
          retention-days: 90
          if-no-files-found: error

  publish:
    needs: [version, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # Every tag and commit: the notes list the commits since the previous release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install --no-self-update

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-files-*
          merge-multiple: true
          path: dist

      - name: Release notes and SHA256SUMS
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          cargo xtask release-notes --tag "$RELEASE_TAG" --dir dist --repository "$REPOSITORY" \
            > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.version.outputs.version_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" --verify-tag "${flags[@]}" \
            --title "Pingers $VERSION_NAME" --notes-file "$RUNNER_TEMP/notes.md" \
            dist/*.apk dist/*.aab dist/SHA256SUMS
