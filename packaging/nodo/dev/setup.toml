# Tier-1 local stack (docs/deploy-nodo.md, "Local testing"): the pingers app's setup page with
# the shape of packaging/nodo's setup.toml.in, for the local services. Run from the repository
# root, after the four services:
#   cargo run --release -p pingers-setup -- packaging/nodo/dev/setup.toml
#   curl -s http://127.0.0.1:9475/owner
# The page's first-phone link opens the first emulator's app on this stack (the hosts are the
# dev Caddy's, packaging/nodo/dev/caddy.json, as an emulator sees them). The public checks have
# nothing to reach and say so.
listen = "127.0.0.1:9475"
domain = "10.0.2.2"
server_id = "https://10.0.2.2:9443"
ohttp_relay_url = "https://10.0.2.2:9444/ohttp"
push_relay_url = "https://10.0.2.2:9445"
map_host = "https://10.0.2.2:9446"
# packaging/nodo/dev/server.toml's code.
registration_code = "dev-registration-code"
gateway_key_config = "http://127.0.0.1:9471/v1/ohttp/config"
push_relay = "http://127.0.0.1:9472"
map_host_local = "http://127.0.0.1:9474"
github_repository = "OceanEilonwy/pingers"
release_tag = "v1.0.0-rc.1"
