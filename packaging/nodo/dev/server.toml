# Tier-1 local stack (docs/deploy-nodo.md, "Local testing"): pingers-server with the shape of
# packaging/nodo's server.toml.in and TEST KEYS ONLY. Run from the repository root:
#   cargo run --release -p pingers-server -- packaging/nodo/dev/server.toml
# The hosts are the dev Caddy's (packaging/nodo/dev/caddy.json) as an emulator sees them.
listen = "127.0.0.1:9470"
server_id = "https://10.0.2.2:9443"
server_operator = "Local test"
ohttp_relay_urls = ["https://10.0.2.2:9444/ohttp"]
map_host = "https://10.0.2.2:9446"
# Map downloads through the relay are forwarded to the map host's own gateway, on this machine.
map_host_gateway = "http://127.0.0.1:9474"
logging = "counts"
counts_interval_s = 60
# The first emulator gets it from the dev setup page's link (packaging/nodo/dev/setup.toml), or a
# debug app build presents it with PINGERS_DEV_REGISTRATION_CODE (docs/deploy-nodo.md).
registration_codes = ["dev-registration-code"]
delivery_db = "target/dev-stack/groups.sqlite"
quota_db = "target/dev-stack/quota.sqlite"
mailbox_db = "target/dev-stack/mailboxes.sqlite"

# Debug app builds (`.debug` package ids, signed with the local debug keystore) open this
# stack's invite links directly. Replace the fingerprint with your own debug keystore's:
#   keytool -list -v -keystore ~/.android/debug.keystore -storepass android
[app_links]
packages = ["org.pingers.app.debug", "org.pingers.app.foss.debug"]
certificates = ["C1:07:CB:BC:EF:B3:BE:DD:52:A6:17:85:92:D9:AE:C5:A9:E1:12:05:A6:C4:92:90:A0:AF:7D:BA:08:F9:6F:1C"]

[ohttp]
listen = "127.0.0.1:9471"
relays = ["127.0.0.1"]
served_key_id = 1

[[ohttp.keys]]
key_id = 1
secret = "1111111111111111111111111111111111111111111111111111111111111111"

[[ohttp.keys]]
key_id = 2
secret = "2222222222222222222222222222222222222222222222222222222222222222"

[metrics]
allow = ["127.0.0.1"]

[[push_relays]]
relay_id = 1
url = "http://127.0.0.1:9472"
public_url = "https://10.0.2.2:9445"
credential = "3333333333333333333333333333333333333333333333333333333333333333"
# Its published key is asked of the local push relay itself, as on the appliance.
key_config_from_relay = true
operator = "Local test"
