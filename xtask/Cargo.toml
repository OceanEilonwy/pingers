[package]
name = "xtask"
description = "Workspace checks that cargo cannot express: the layer rule, the CI sequence, and nodo packaging."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.pingers]
layer = "dev"

[dependencies]
anyhow = { workspace = true }
# `pins`: key configs from the deployed private keys, with the server's and relay's own calls.
pingers-crypto = { workspace = true }
pingers-ohttp = { workspace = true }
pingers-proto = { workspace = true }
hex = { workspace = true }
toml = { workspace = true }
zeroize = { workspace = true }
# nodo-dist: the tarball's gzip (deterministic header) and its SHA-256.
flate2 = { workspace = true }
sha2 = { workspace = true }
# dev-ca: a throwaway CA and leaf for the tier-1 local stack.
rcgen = { workspace = true }
# local-stack: the supervisor waits for Ctrl-C (SIGINT) or SIGTERM, and the TLS front (used
# when Caddy is not installed) serves h2 and HTTP/1.1 and streams to h2c upstreams. All already
# in the tree through pingers-server, pingers-map-host and pingers-transport.
tokio = { workspace = true, features = ["net", "signal", "io-util"] }
hyper = { workspace = true, features = ["http1"] }
hyper-util = { workspace = true, features = ["server", "server-auto", "http1"] }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
serde_json = { workspace = true }
http-body-util = { workspace = true }

[dev-dependencies]
# `pins` is checked against the relay's and the server's own `pins` subcommands.
pingers-push-relay = { path = "../crates/pingers-push-relay" }
# tests/nodo_packaging.rs also parses the rendered server config with the server's parser.
pingers-server = { path = "../crates/pingers-server" }
# tests/nodo_packaging.rs parses the rendered map host config with the host's own parser.
pingers-map-host = { path = "../crates/pingers-map-host" }
# tests/nodo_packaging.rs checks packaging/nodo with nodo's own parsers.
nodo-manifest = { workspace = true }
nodo-settings = { workspace = true }

[lints]
workspace = true
