<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meetup chat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2F5BFF}a:hover{color:#1E40C8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5F1; color: #15171C; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 56px 12px 10px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #E3E1DA; background: #fff">
    <a href="Meetup.dc.html" aria-label="Back to meetup" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#15171C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <span style="display: flex; flex-direction: column; gap: 1px">
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 600">Riverside Park</h1>
      <span style="font-size: 12px; color: #5B606B">Ben, Chloé, you · deleted when meetup ends</span>
    </span>
  </div>

  <div style="flex-grow: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <span style="align-self: center; font-size: 12px; color: #5B606B; background: #EDEBE5; border-radius: 999px; padding: 4px 12px">Chloé joined · 14:40</span>

    <div style="display: flex; gap: 10px; align-items: flex-start">
      <span style="width: 32px; height: 32px; border-radius: 16px; background: #FFE7B8; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0">BE</span>
      <div style="display: flex; flex-direction: column; gap: 6px; max-width: 270px">
        <span style="background: #fff; border: 1px solid #E3E1DA; border-radius: 4px 18px 18px 18px; padding: 10px 14px; font-size: 15px; line-height: 1.4">Who's up for coffee after? I'm by the bandstand</span>
        <a href="#thread" style="text-decoration: none; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; min-height: 32px">
          <span style="display: flex"><span style="width: 18px; height: 18px; border-radius: 9px; background: #CFE0FF; border: 2px solid #F6F5F1"></span><span style="width: 18px; height: 18px; border-radius: 9px; background: #DDEFD3; border: 2px solid #F6F5F1; margin-left: -6px"></span></span>2 replies</a>
      </div>
    </div>

    <div id="thread" style="margin-left: 42px; border-left: 2px solid #D6D3CB; padding-left: 12px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; gap: 8px; align-items: flex-start">
        <span style="width: 26px; height: 26px; border-radius: 13px; background: #CFE0FF; font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0">CH</span>
        <span style="background: #fff; border: 1px solid #E3E1DA; border-radius: 4px 16px 16px 16px; padding: 8px 12px; font-size: 14px; line-height: 1.4">Yes! 5 min</span>
      </div>
      <div style="display: flex; justify-content: flex-end">
        <span style="background: #2F5BFF; color: #fff; border-radius: 16px 4px 16px 16px; padding: 8px 12px; font-size: 14px; line-height: 1.4">On my way</span>
      </div>
    </div>

    <div style="display: flex; gap: 10px; align-items: flex-start">
      <span style="width: 32px; height: 32px; border-radius: 16px; background: #FFE7B8; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0">BE</span>
      <span style="background: #FFF3EC; border: 1px solid #FFD9C7; border-radius: 4px 18px 18px 18px; padding: 10px 14px; font-size: 14px; display: flex; align-items: center; gap: 8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B23C00" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>Set the meet point: bandstand
      </span>
    </div>

    <div style="display: flex; justify-content: flex-end">
      <span style="background: #2F5BFF; color: #fff; border-radius: 18px 4px 18px 18px; padding: 10px 14px; font-size: 15px; line-height: 1.4; max-width: 260px">I can see you on the compass, 2 min</span>
    </div>
  </div>

  <div style="padding: 10px 12px 30px; background: #fff; border-top: 1px solid #E3E1DA; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12px; color: #5B606B; padding-left: 8px">Replying in thread · Ben</span>
    <div style="display: flex; gap: 8px; align-items: center">
      <label style="flex-grow: 1; height: 44px; border-radius: 22px; background: #F0EFEA; display: flex; align-items: center; padding: 0 16px">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Message</span>
        <input placeholder="Message" style="border: 0; outline: none; background: transparent; font: inherit; font-size: 15px; width: 100%">
      </label>
      <button aria-label="Send" style="width: 44px; height: 44px; border-radius: 22px; background: #2F5BFF; border: 0; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
