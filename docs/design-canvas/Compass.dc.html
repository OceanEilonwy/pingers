<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compass to meet point</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#fff}a:hover{color:#E6E9F0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #15171C; color: #fff; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 56px 20px 34px; gap: 18px; overflow: hidden">
  <div style="align-self: stretch; display: flex; align-items: center; justify-content: space-between">
    <a href="Meetup.dc.html" aria-label="Close compass" style="width: 44px; height: 44px; border-radius: 22px; background: #262A33; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <span style="font-size: 13px; color: #B9BDC7; background: #262A33; border-radius: 999px; padding: 8px 12px">GPS ±6 m</span>
  </div>

  <div role="group" aria-label="Navigate to" style="align-self: stretch; display: flex; gap: 8px">
    <button aria-pressed="true" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #E8590C; color: #fff; font: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>Bandstand</button>
    <button aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #3A3F49; background: transparent; color: #fff; font: inherit; font-size: 14px; font-weight: 600">Ben</button>
    <button aria-label="Chloé: location private, ask to see" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px dashed #5B606B; background: transparent; color: #B9BDC7; font: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B9BDC7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Chloé</button>
  </div>

  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center">
    <svg width="320" height="320" viewBox="0 0 320 320" role="img" aria-label="Arrow pointing north-east, 42 degrees, toward the bandstand">
      <circle cx="160" cy="160" r="150" fill="#1E2129" stroke="#2E323C" stroke-width="2"/>
      <g stroke="#4A4F5B" stroke-width="2">
        <path d="M160 18v14M160 288v14M18 160h14M288 160h14"/>
        <path d="M260.4 59.6l-8.5 8.5M68.1 251.9l-8.5 8.5M59.6 59.6l8.5 8.5M251.9 251.9l8.5 8.5"/>
      </g>
      <text x="160" y="52" text-anchor="middle" fill="#B9BDC7" font-family="Inter, sans-serif" font-size="14" font-weight="600">N</text>
      <circle cx="160" cy="160" r="104" fill="none" stroke="#E8590C" stroke-opacity="0.25" stroke-width="14" stroke-dasharray="40 613" transform="rotate(-62 160 160)"/>
      <g transform="rotate(42 160 160)">
        <path d="M160 70 L196 178 L160 158 L124 178 Z" fill="#E8590C"/>
      </g>
      <circle cx="160" cy="160" r="6" fill="#fff"/>
    </svg>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
    <span style="font-family: 'Space Grotesk', sans-serif; font-size: 64px; font-weight: 600; line-height: 1">85 m</span>
    <span style="font-size: 15px; color: #B9BDC7">About 1 min walk · north-east</span>
  </div>
  <span style="font-size: 13px; color: #B9BDC7; text-align: center; line-height: 1.45">Phone taps when you face the right way.<br>Ben and Chloé see you're heading over.</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
