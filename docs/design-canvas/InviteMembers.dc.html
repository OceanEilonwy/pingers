<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invite to party</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2F5BFF}a:hover{color:#1E40C8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5F1; color: #15171C; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 56px 12px 8px; display: flex; align-items: center; gap: 4px">
    <a href="PartyDetail.dc.html" aria-label="Back to Climbing crew" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#15171C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <span style="display: flex; flex-direction: column; gap: 1px">
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">Invite people</h1>
      <span style="font-size: 12px; color: #5B606B">Climbing crew</span>
    </span>
  </div>

  <div style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 16px; flex-grow: 1">
    <div style="background: #fff; border: 1px solid #E3E1DA; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 14px">
      <svg width="160" height="160" viewBox="0 0 21 21" role="img" aria-label="Invite QR code" shape-rendering="crispEdges">
        <rect width="21" height="21" fill="#fff"/>
        <path fill="#15171C" d="M0 0h7v7H0zM14 0h7v7h-7zM0 14h7v7H0z"/>
        <path fill="#fff" d="M1 1h5v5H1zM15 1h5v5h-5zM1 15h5v5H1z"/>
        <path fill="#15171C" d="M2 2h3v3H2zM16 2h3v3h-3zM2 16h3v3H2zM8 0h1v2H8zM10 1h2v1h-2zM9 3h3v1H9zM8 5h1v3H8zM11 5h2v2h-2zM0 8h2v1H0zM3 8h3v1H3zM9 9h3v1H9zM13 8h2v2h-2zM16 8h3v1h-3zM19 10h2v2h-2zM1 10h2v2H1zM5 10h2v1H5zM8 11h1v3H8zM10 12h3v1h-3zM14 11h2v2h-2zM17 12h1v3h-1zM9 15h2v2H9zM12 14h2v1h-2zM15 15h2v2h-2zM19 14h2v1h-2zM8 18h3v1H8zM12 17h1v4h-1zM14 18h3v1h-3zM18 17h2v2h-2zM15 20h2v1h-2zM19 20h2v1h-2z"/>
      </svg>
      <span style="font-size: 13px; color: #5B606B; text-align: center; line-height: 1.45">Scan in person, or share the link.<br>Each invite works once · expires in 24 h</span>
      <button style="height: 50px; width: 100%; border-radius: 25px; background: #2F5BFF; color: #fff; border: 0; font: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v13M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>Share invite link
      </button>
    </div>

    <h2 style="margin: 4px 4px 0; font-size: 13px; font-weight: 600; color: #5B606B; letter-spacing: 0.4px">INVITATIONS</h2>
    <div style="background: #fff; border: 1px solid #E3E1DA; border-radius: 18px; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #EEECE6">
        <span style="width: 40px; height: 40px; border-radius: 20px; background: #FFE7B8; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center">BE</span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Ben</span><span style="font-size: 13px; color: #5B606B">Opened the link · compare code 4821</span></span>
        <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #2F5BFF; background: #fff; color: #2F5BFF; font: inherit; font-size: 14px; font-weight: 600">Verify</button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #EEECE6">
        <span style="width: 40px; height: 40px; border-radius: 20px; background: #F0EFEA; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B606B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg></span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Link shared 2 h ago</span><span style="font-size: 13px; color: #5B606B">Not opened yet · expires in 22 h</span></span>
        <button aria-label="Cancel this invite" style="width: 36px; height: 36px; padding: 0; border-radius: 18px; border: 0; background: #F0EFEA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#15171C" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px">
        <span style="width: 40px; height: 40px; border-radius: 20px; background: #CFE0FF; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center">CH</span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Chloé</span><span style="font-size: 13px; color: #1F7A45">Joined · code verified</span></span>
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#1F8A4C"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
  </div>
  <div style="padding: 16px 20px 34px">
    <a href="PartyDetail.dc.html" style="text-decoration: none; height: 52px; border-radius: 26px; background: #15171C; color: #fff; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center">Done</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
