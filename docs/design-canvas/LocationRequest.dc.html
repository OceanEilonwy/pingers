<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exact location request</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2F5BFF}a:hover{color:#1E40C8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ECEAE3; color: #15171C; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden">
  <svg width="390" height="460" viewBox="0 0 390 460" aria-hidden="true" style="position: absolute; left: 0; top: 0">
    <rect width="390" height="460" fill="#ECEAE3"/>
    <path d="M0 340 C80 310 150 380 240 355 S360 310 390 330 L390 460 L0 460Z" fill="#CFE0EC"/>
    <rect x="50" y="130" width="280" height="190" rx="44" fill="#DCE8D2"/>
    <path d="M0 110 L390 92" stroke="#fff" stroke-width="14"/>
    <path d="M350 0 L365 460" stroke="#fff" stroke-width="10"/>
    <path d="M20 0 L14 460" stroke="#fff" stroke-width="7"/>
  </svg>
  <div style="position: absolute; inset: 0; background: rgba(21,23,28,0.45)"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="lr-title" style="position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 28px 28px 0 0; padding: 10px 20px 34px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
    <span style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #D6D3CB"></span>
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 52px; height: 52px; border-radius: 26px; background: #CFE0FF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0">CH</span>
      <span style="display: flex; flex-direction: column; gap: 3px">
        <h1 id="lr-title" style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 21px; font-weight: 600; line-height: 1.2">Chloé wants to see exactly where you are</h1>
        <span style="font-size: 13px; color: #5B606B">She can already see you're in Riverside Park.</span>
      </span>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 13px; font-weight: 600; color: #5B606B; padding: 0; margin-bottom: 8px">Share for</legend>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px; border-radius: 14px; border: 1.5px solid #2F5BFF; background: #F4F6FF; font-size: 15px; font-weight: 500">
        <input type="radio" name="dur" checked style="width: 20px; height: 20px; accent-color: #2F5BFF; margin: 0">This meetup
      </label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid #E3E1DA; font-size: 15px; font-weight: 500">
        <input type="radio" name="dur" style="width: 20px; height: 20px; accent-color: #2F5BFF; margin: 0">15 minutes
      </label>
    </fieldset>

    <div style="display: flex; flex-direction: column">
      <label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 15px">
        <input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #2F5BFF; margin: 0">Ask to see Chloé too
      </label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 15px">
        <input type="checkbox" style="width: 20px; height: 20px; accent-color: #2F5BFF; margin: 0">Always allow Chloé in Climbing crew
      </label>
    </div>

    <div style="display: flex; gap: 10px; align-items: flex-start; background: #F6F5F1; border-radius: 14px; padding: 12px 14px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F5BFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      <span style="font-size: 13px; line-height: 1.45; color: #3A3F49">Only Chloé gets the key. Others in the meetup and the server can't tell who you share with.</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <a href="Meetup.dc.html" style="text-decoration: none; height: 52px; border-radius: 26px; background: #F0EFEA; color: #15171C; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center">Not now</a>
      <a href="Meetup.dc.html" style="text-decoration: none; height: 52px; border-radius: 26px; background: #2F5BFF; color: #fff; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center">Allow</a>
    </div>
    <span style="font-size: 12px; color: #5B606B; text-align: center; line-height: 1.4">"Not now" is silent. Chloé only sees her request expire.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
