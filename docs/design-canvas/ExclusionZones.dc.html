<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exclusion zones</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2F5BFF}a:hover{color:#1E40C8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5F1; color: #15171C; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 56px 12px 4px; display: flex; align-items: center; gap: 4px">
    <a href="PrivacySettings.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#15171C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">Exclusion zones</h1>
  </div>
  <p style="margin: 4px 24px 14px; font-size: 14px; color: #5B606B; line-height: 1.45">Inside these areas Pingers never sends your location, to any party. Zones are stored only on this phone.</p>

  <div style="margin: 0 20px; height: 250px; border-radius: 22px; overflow: hidden; position: relative; border: 1px solid #E3E1DA">
    <svg width="350" height="250" viewBox="0 0 350 250" aria-hidden="true" style="position: absolute; inset: 0">
      <defs>
        <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#15171C" fill-opacity="0.06"/><path d="M0 0v8" stroke="#15171C" stroke-opacity="0.35" stroke-width="2"/></pattern>
      </defs>
      <rect width="350" height="250" fill="#ECEAE3"/>
      <rect x="200" y="140" width="130" height="90" rx="14" fill="#DCE8D2"/>
      <path d="M0 95 L350 120" stroke="#fff" stroke-width="12"/>
      <path d="M150 0 L170 250" stroke="#fff" stroke-width="10"/>
      <path d="M0 200 L350 185" stroke="#fff" stroke-width="6"/>
      <path d="M270 0 L260 250" stroke="#fff" stroke-width="5"/>
      <circle cx="80" cy="60" r="42" fill="url(#hatch)" stroke="#15171C" stroke-width="2"/>
      <rect x="215" y="25" width="100" height="70" rx="8" fill="url(#hatch)" stroke="#15171C" stroke-width="2"/>
      <circle cx="160" cy="160" r="7" fill="#2F5BFF" stroke="#fff" stroke-width="3"/>
    </svg>
    <span style="position: absolute; left: 50px; top: 52px; background: #15171C; color: #fff; font-size: 12px; font-weight: 600; border-radius: 8px; padding: 3px 8px">Home</span>
    <span style="position: absolute; left: 245px; top: 50px; background: #15171C; color: #fff; font-size: 12px; font-weight: 600; border-radius: 8px; padding: 3px 8px">Work</span>
  </div>

  <div style="margin: 16px 20px 0; background: #fff; border: 1px solid #E3E1DA; border-radius: 18px; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #EEECE6">
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">Home</span><span style="font-size: 13px; color: #5B606B">150 m circle · all parties</span></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B606B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #EEECE6">
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">Work</span><span style="font-size: 13px; color: #5B606B">Drawn area · weekdays 08:00–18:00</span></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B606B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </div>
    <button style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; min-height: 52px; border: 0; background: transparent; font: inherit; font-size: 16px; font-weight: 600; color: #2F5BFF; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F5BFF" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add exclusion zone
    </button>
  </div>

  <div style="margin: 14px 20px 0; background: #fff; border: 1px solid #E3E1DA; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 12px">
    <label for="buffer" style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Hide trail near zones</span><span style="font-size: 13px; color: #5B606B; line-height: 1.4">Stay hidden for 5 min after leaving, so nobody can trace you back</span></label>
    <input id="buffer" type="checkbox" checked style="width: 24px; height: 24px; accent-color: #2F5BFF">
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
