# Surviving mutants that `cargo xtask ci --full` accepts.
#
# Each entry names one mutant as `cargo mutants` prints it in `mutants.out/missed.txt` (or
# `timeout.txt`), with or without its `:line:column`, and says why no test should kill it:
# usually that the mutant is equivalent (no input can tell it apart). "Hard to test" is not a
# reason; write the test. An entry for a crate that was mutated but that no longer survives
# fails the run, so remove it when a test starts killing it.
#
# [[mutant]]
# name = "crates/pingers-example/src/lib.rs: replace | with ^ in write_varint"
# reason = "the operands share no set bits, so OR and XOR agree for every input"

[[mutant]]
name = "crates/pingers-geo/src/measure.rs: replace < with <= in Meters::constant"
reason = "equivalent: at 0.0 both branches give a zero length (Meters::ZERO and Self(0.0) or Self(-0.0) compare equal)"

[[mutant]]
name = "crates/pingers-geo/src/presence.rs: replace > with >= in SpotPresence::restore"
reason = "equivalent (two sites): when the compared times are equal, both branches pick the same UnixSeconds"

[[mutant]]
name = "crates/pingers-client/src/real/meetups.rs: replace Meetups::runtime -> Option<Runtime> with None"
reason = "equivalent in the client tests: they run without an instance, so there is no runtime either way, and with one the create_group call needs a reachable server. Remove when a client test runs against the harness server."

[[mutant]]
name = "crates/pingers-client/src/real/meetups.rs: replace <impl MeetupPort for Meetups>::leave -> Result<(), PortError> with Ok(())"
reason = "equivalent in the client tests: without a harness server no Meetup goes live, so leave always finds none and answers Ok(()). Remove when a client test runs a Meetup against the harness server."


[[mutant]]
name = "crates/pingers-parties/src/link.rs: replace | with ^ in base64url_encode"
