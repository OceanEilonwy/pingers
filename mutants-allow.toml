# Surviving mutants that `cargo xtask ci --full` accepts.
#
# Each entry names one mutant as `cargo mutants` prints it in `mutants.out/missed.txt` (or
# `timeout.txt`), with or without its `:line:column`, and says why no test should kill it:
# usually that the mutant is equivalent (no input can tell it apart). "Hard to test" is not a
# reason; write the test. An entry for a crate that was mutated but that no longer survives
# fails the run, so remove it when a test starts killing it.
#
# [[mutant]]
# name = "crates/pingers-example/src/lib.rs: replace | with ^ in write_varint"
# reason = "the operands share no set bits, so OR and XOR agree for every input"

[[mutant]]
name = "crates/pingers-geo/src/measure.rs: replace < with <= in Meters::constant"
reason = "equivalent: at 0.0 both branches give a zero length (Meters::ZERO and Self(0.0) or Self(-0.0) compare equal)"

[[mutant]]
name = "crates/pingers-geo/src/presence.rs: replace > with >= in SpotPresence::restore"
reason = "equivalent (two sites): when the compared times are equal, both branches pick the same UnixSeconds"

[[mutant]]
name = "crates/pingers-client/src/real/meetups.rs: replace Meetups::runtime -> Option<Runtime> with None"
reason = "equivalent in the client tests: they run without an instance, so there is no runtime either way, and with one the create_group call needs a reachable server. Remove when a client test runs against the harness server."

[[mutant]]
name = "crates/pingers-client/src/real/meetups.rs: replace <impl MeetupPort for Meetups>::leave -> Result<(), PortError> with Ok(())"
reason = "equivalent in the client tests: without a harness server no Meetup goes live, so leave always finds none and answers Ok(()). Remove when a client test runs a Meetup against the harness server."


[[mutant]]
name = "crates/pingers-parties/src/joining.rs: replace match guard admitted == reply with true in PartyLifecycle<'_>::approve_join"
reason = "defensive and unreachable through the API: letting someone in drops every other request through that invite, and a used invite refuses new ones, so the only request a used invite can still hold is the one it admitted (put back by commit_rejected)"

[[mutant]]
name = "crates/pingers-server/src/http.rs: replace <impl HttpBody for TrackedBody>::is_end_stream -> bool with false"
reason = "equivalent: is_end_stream is only a hint; with false, hyper polls the inner body once more, gets its end, and the client receives the same response"

[[mutant]]
name = "crates/pingers-server/src/http.rs: replace >= with < in IdleWatch::serve"
reason = "caught as a timeout, not missed: every connection is then closed as soon as it opens, and tests that wait on the manual clock for an answer hang until cargo-mutants gives up"

[[mutant]]
name = "crates/pingers-wake/src/state.rs: replace < with <= in Board::prune"
reason = "equivalent: a knock is decided after its record's lease started, so exactly one lease after the decision that lease has expired and its knock mailbox is no longer read; keeping or dropping the decision at that instant cannot be observed (the comment at the call says so)"

[[mutant]]
name = "crates/pingers-client/src/real/sync.rs: replace Net::post_welcome -> Result<(), PortError> with Ok(())"
reason = "equivalent in the client tests: a Meetup Welcome is posted only after a knock is accepted, and no knock is ever built while Lens::key_package answers Unavailable (WAITING(contracts) in wake_ports.rs). Remove when knocks run between two harness devices."

[[mutant]]
name = "crates/pingers-client/src/real/sync.rs: replace <impl ServerPort for Net>::post_knock -> Result<(), PortError> with Ok(())"
reason = "equivalent in the client tests: no knock is ever built while Lens::key_package answers Unavailable (WAITING(contracts) in wake_ports.rs), so post_knock is never called. Remove when knocks run between two harness devices."

[[mutant]]
name = "crates/pingers-client/src/real/sync.rs: replace <impl ServerPort for Net>::read_mailbox -> Result<Vec<Vec<u8>>, PortError> with Ok(vec![])"
reason = "equivalent in the client tests: knock and reply mailboxes stay empty while no knock can be built (Lens::key_package, WAITING(contracts)); reading none and reading nothing are the same. Remove when knocks run between two harness devices."

[[mutant]]
name = "crates/pingers-client/src/real/sync.rs: replace <impl ServerPort for Net>::read_mailbox -> Result<Vec<Vec<u8>>, PortError> with Ok(vec![vec![]])"
reason = "equivalent in the client tests: a post that does not open as a knock or a Welcome is skipped, and no real post can arrive while no knock can be built (Lens::key_package, WAITING(contracts)). Remove when knocks run between two harness devices."

[[mutant]]
name = "crates/pingers-client/src/real/sync.rs: replace <impl ServerPort for Net>::read_mailbox -> Result<Vec<Vec<u8>>, PortError> with Ok(vec![vec![0]])"
reason = "equivalent in the client tests: a post that does not open as a knock or a Welcome is skipped, and no real post can arrive while no knock can be built (Lens::key_package, WAITING(contracts)). Remove when knocks run between two harness devices."

[[mutant]]
name = "crates/pingers-client/src/real/sync.rs: replace <impl ServerPort for Net>::read_mailbox -> Result<Vec<Vec<u8>>, PortError> with Ok(vec![vec![1]])"
reason = "equivalent in the client tests: a post that does not open as a knock or a Welcome is skipped, and no real post can arrive while no knock can be built (Lens::key_package, WAITING(contracts)). Remove when knocks run between two harness devices."

[[mutant]]
name = "crates/pingers-client/src/real/sync.rs: replace <impl GroupNetwork for GroupLogs>::create_group -> Result<(), NetworkError> with Ok(())"
reason = "equivalent in the client tests, as Meetups::runtime above: no Meetup is created without an accepted knock. Remove when a client test runs a Meetup against the harness server."

[[mutant]]
name = "crates/pingers-client/src/real/sync.rs: replace <impl GroupNetwork for GroupLogs>::post_message -> Result<(), NetworkError> with Ok(())"
reason = "equivalent in the client tests, as Meetups::runtime above: no Meetup goes live, so no Meetup message is posted. Remove when a client test runs a Meetup against the harness server."

[[mutant]]
name = "crates/pingers-client/src/real/sync.rs: replace <impl GroupNetwork for GroupLogs>::fetch_log -> Result<Vec<GroupLogEntry>, NetworkError> with Ok(vec![])"
reason = "equivalent in the client tests, as Meetups::runtime above: no Meetup goes live, so no Meetup log is read. Remove when a client test runs a Meetup against the harness server."

[[mutant]]
name = "crates/pingers-client/src/real/sync.rs: replace <impl GroupNetwork for GroupLogs>::delete_group -> Result<(), NetworkError> with Ok(())"
reason = "equivalent in the client tests, as Meetups::runtime above: no Meetup goes live, so none is deleted. Remove when a client test runs a Meetup against the harness server."

[[mutant]]
name = "crates/pingers-crypto/src/checksum.rs: replace | with ^ in ContentDigest::from_hex"
reason = "equivalent: the high nibble is shifted left by four and the low one is below sixteen, so they share no set bits and OR and XOR agree for every input"

[[mutant]]
name = "crates/pingers-map-host/src/gateway.rs: replace match guard error.kind() == io::ErrorKind::NotFound with true in load_or_create_key"
reason = "equivalent: a key file that exists but cannot be read is then made again with create_new, which fails because the file exists, so both report OhttpKeyFile and no key is replaced"

[[mutant]]
name = "crates/pingers-anon/src/circuit.rs: replace ceremony::matches_ceremony -> bool with true"
reason = "equivalent for every build: the only key compiled in is the ceremony's, so the check is true either way. The comparator it calls (ceremony::matches) is tested with each field altered, and the self-test's handling of a false answer is tested with an injected check."
