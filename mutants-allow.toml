name = "crates/pingers-parties/src/joining.rs: replace match guard admitted == reply with true in PartyLifecycle<'_>::approve_join"
reason = "defensive and unreachable through the API: letting someone in drops every other request through that invite, and a used invite refuses new ones, so the only request a used invite can still hold is the one it admitted (put back by commit_rejected)"

[[mutant]]
name = "crates/pingers-server/src/http.rs: replace <impl HttpBody for TrackedBody>::is_end_stream -> bool with false"
reason = "equivalent: is_end_stream is only a hint; with false, hyper polls the inner body once more, gets its end, and the client receives the same response"

[[mutant]]
name = "crates/pingers-server/src/http.rs: replace >= with < in IdleWatch::serve"
reason = "caught as a timeout, not missed: every connection is then closed as soon as it opens, and tests that wait on the manual clock for an answer hang until cargo-mutants gives up"

[[mutant]]
name = "crates/pingers-crypto/src/checksum.rs: replace | with ^ in ContentDigest::from_hex"
reason = "equivalent: the high nibble is shifted left by four and the low one is below sixteen, so they share no set bits and OR and XOR agree for every input"

[[mutant]]
name = "crates/pingers-map-host/src/gateway.rs: replace match guard error.kind() == io::ErrorKind::NotFound with true in load_or_create_key"
reason = "equivalent: a key file that exists but cannot be read is then made again with create_new, which fails because the file exists, so both report OhttpKeyFile and no key is replaced"

[[mutant]]
name = "crates/pingers-anon/src/circuit.rs: replace ceremony::matches_ceremony -> bool with true"
reason = "equivalent for every build: the only key compiled in is the ceremony's, so the check is true either way. The comparator it calls (ceremony::matches) is tested with each field altered, and the self-test's handling of a false answer is tested with an injected check."

[[mutant]]
name = "crates/pingers-client/src/real/sync.rs: replace && with || in Net::flush"
reason = "equivalent in effect: with || a round that sent something but queued nothing new runs again, which only retries at once the requests it just kept (they went back in the outbox); every request still goes out at most once and the rounds stay bounded by FLUSH_ROUNDS"
