[package]
name = "pingers-crypto"
description = "The only place cryptographic primitives are called: domain-separated keys, tags, AEAD, HPKE, signatures."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.pingers]
layer = 0

[features]
# Post-quantum grant keys (X-Wing HPKE) for Parties that opt in (design B.8).
x-wing = ["dep:x-wing"]

[dependencies]
pingers-proto = { workspace = true }
pingers-time = { workspace = true }
aes-gcm = { workspace = true }
chacha20poly1305 = { workspace = true }
ed25519-dalek = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
# `hazmat` exposes derived private-key bytes, which GrantSecretKey stores.
hpke-rs = { workspace = true, features = ["hazmat"] }
hpke-rs-crypto = { workspace = true }
rand_core = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
x-wing = { workspace = true, optional = true }
zeroize = { workspace = true }

[dev-dependencies]
pingers-testkit = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
