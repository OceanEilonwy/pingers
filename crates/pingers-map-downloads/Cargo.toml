[package]
name = "pingers-map-downloads"
description = "Region map downloads: catalogs from the map host chain, whole packs direct or through the privacy relay, checked and installed."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.pingers]
layer = 3

[dependencies]
# Content checksums of downloaded packs and indexes.
pingers-crypto = { workspace = true }
# The manifest and catalog formats map hosts serve.
pingers-map-packs = { workspace = true }
# Requests sealed to the map host's own gateway, padded to size classes.
pingers-ohttp = { workspace = true }
# MapHostUrl and KeyConfigHash.
pingers-proto = { workspace = true }
pingers-time = { workspace = true }
# Direct GETs (PublicClient) and the OHTTP route to the server's gateway (Transport).
pingers-transport = { workspace = true }
async-trait = { workspace = true }
rand_core = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util"] }

[dev-dependencies]
# The in-process server with its OHTTP relay, a TLS front, and the map host, for the
# end-to-end tests.
pingers-testkit = { workspace = true, features = ["harness"] }
pingers-crypto = { workspace = true }
pingers-map-host = { workspace = true }
pingers-time = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["fs", "io-util", "net", "test-util"] }
# The map host's gateway key, written before it starts so the tests know its pin.
hex = { workspace = true }
zeroize = { workspace = true }

[lints]
workspace = true
