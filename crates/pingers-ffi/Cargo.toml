[package]
name = "pingers-ffi"
description = "UniFFI bindings."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.pingers]
layer = 5

# The Android app loads the cdylib; `lib` keeps `cargo test` and the bindgen binary working.
[lib]
crate-type = ["cdylib", "lib"]
name = "pingers_ffi"

# Generates the Kotlin bindings from the built library (android/app/build.gradle.kts):
# cargo run -p pingers-ffi --features bindgen --bin uniffi-bindgen -- generate --library ...
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = ["wipe-freed", "x-wing"]
bindgen = ["uniffi/cli"]
# Zero every block of memory as it is freed (src/wiping.rs), as fob-ffi does. Off only to
# measure what it costs.
wipe-freed = []
# Quantum-resistant Parties (design B.8), on in the shipped app: X-Wing groups, and a join
# request carries an X-Wing key package next to the classical one.
x-wing = ["pingers-client/x-wing"]

[dependencies]
hex = { workspace = true }
pingers-client = { workspace = true }
pingers-gate = { workspace = true }
pingers-geo = { workspace = true }
pingers-meetup = { workspace = true }
# The map catalog, offers and manifests the app's map calls convert.
pingers-map-downloads = { workspace = true }
pingers-map-packs = { workspace = true }
pingers-proto = { workspace = true }
pingers-screens = { workspace = true }
pingers-store = { workspace = true }
pingers-time = { workspace = true }
pingers-words = { workspace = true }
thiserror = { workspace = true }
uniffi = { workspace = true, features = ["tokio"] }
zeroize = { workspace = true }

[dev-dependencies]
pingers-screens = { workspace = true, features = ["fixtures"] }
pingers-testkit = { workspace = true, features = ["client"] }
tokio = { workspace = true }

# The workspace's lints, copied because Cargo cannot override a single inherited lint. Keep in
# step with [workspace.lints] in the root Cargo.toml. The one difference is `unsafe_code`.
[lints.rust]
# The listed exception to the workspace's `forbid` (style guide §11): the `wipe-freed` zeroing
# allocator. Only src/wiping.rs expects the lint; anywhere else it is still an error.
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Section 5: no panics
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
panic_in_result_fn = "deny"
exit = "deny"
# Sections 1, 4, 11
fn_params_excessive_bools = "deny"
missing_errors_doc = "warn"
wildcard_enum_match_arm = "warn"
allow_attributes = "deny"          # use #[expect(.., reason = "..")]
allow_attributes_without_reason = "deny"
# Section 9 and hygiene
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
