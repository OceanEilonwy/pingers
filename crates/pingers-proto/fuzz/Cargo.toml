[package]
name = "pingers-proto-fuzz"
description = "cargo-fuzz targets, one per pingers-proto decoder."
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
pingers-proto = { path = ".." }

# Not a member of the main workspace: fuzzing needs nightly and its own profile.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "board_page"
path = "fuzz_targets/board_page.rs"
test = false
doc = false
bench = false

