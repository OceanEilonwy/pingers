[package]
name = "pingers-push-relay"
description = "Push relay binary."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.pingers]
layer = 5

[dependencies]
# `rs256`: the FCM service-account assertion.
pingers-crypto = { workspace = true, features = ["rs256"] }
pingers-proto = { workspace = true }
pingers-time = { workspace = true }
# The production Timer (TokioTimer) for upstream timeouts and the counts report.
pingers-transport = { workspace = true }
axum = { workspace = true }
# The accept loop (connections.rs): HTTP/1.1 connections with an idle timeout.
hyper = { workspace = true, features = ["http1"] }
hyper-util = { workspace = true, features = ["service"] }
# `keygen`: a ChaCha generator seeded from the operating system (the server's pattern).
getrandom = { workspace = true }
hex = { workspace = true }
rand_chacha = { workspace = true }
rand_core = { workspace = true }
reqwest = { workspace = true }
# Mozilla's roots for the push services' TLS, bundled, so the client never needs the system's.
webpki-root-certs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "signal"] }
toml = { workspace = true }
url = { workspace = true }
# "serde": a plain `credential` and `service_account_json` are read straight into Zeroizing.
zeroize = { workspace = true, features = ["serde"] }

[dev-dependencies]
# Checks the FCM assertion's signature against the test key's public half.
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
pingers-testkit = { workspace = true }
# Throwaway RSA keys for the service-account tests.
rcgen = { workspace = true }

[lints]
workspace = true
