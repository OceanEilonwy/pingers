[package]
name = "pingers-meetup-session"
description = "A live meetup: channel, members, lifecycle."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.pingers]
layer = 3

[features]
# The X-Wing suite for quantum-resistant Parties (design B.8), and X-Wing grant keys in their
# Meetups.
x-wing = ["pingers-crypto/x-wing", "pingers-mls/x-wing"]

[dependencies]
pingers-crypto = { workspace = true }
pingers-geo = { workspace = true }
pingers-meetup = { workspace = true }
pingers-mls = { workspace = true }
pingers-presence = { workspace = true }
pingers-proto = { workspace = true }
pingers-store = { workspace = true }
pingers-time = { workspace = true }
pingers-transport = { workspace = true }
async-trait = { workspace = true }
rand_core = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
pingers-testkit = { workspace = true }
pingers-time = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
