[package]
name = "pingers-map-host"
description = "Map host binary: serves whole-region PMTiles packs, manifests and search indexes."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.pingers]
layer = 5

[dependencies]
pingers-time = { workspace = true }
# The production cutter: pmtiles extract, the places index and the manifest.
pingers-map-packs = { workspace = true }
# The production Timer (TokioTimer) for the counts report.
pingers-transport = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
# The generated catalog, manifests read from disk, and cache-state.json.
serde_json = { workspace = true }
# Content checksums of public files for strong ETags (files.rs).
pingers-crypto = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "net", "signal"] }
tokio-util = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
pingers-testkit = { workspace = true }
reqwest = { workspace = true }

[lints]
workspace = true
