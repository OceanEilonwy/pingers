[package]
name = "pingers-transport"
description = "Router and OHTTP client: getting bytes to the server by privacy class."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.pingers]
layer = 2

[dependencies]
pingers-ohttp = { workspace = true }
pingers-proto = { workspace = true }
pingers-time = { workspace = true }
async-trait = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
rand_core = { workspace = true }
rustls = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }

[dev-dependencies]
pingers-testkit = { workspace = true }
pingers-time = { workspace = true, features = ["test-util"] }
rcgen = { workspace = true }
tokio = { workspace = true, features = ["test-util", "net"] }
# The reference relay the integration tests (tests/integration) run. Its library target has no
# workspace entry (pingers-testkit does the same for the binaries).
pingers-ohttp-relay = { path = "../pingers-ohttp-relay" }

[lints]
workspace = true
