# Design G.5: a third person joins a running Meetup.
#
# Alice and Bob are in a Meetup (as at the end of G.4). Carol arrives; two records match, both
# hinting the Meetup, and she knocks on both mailboxes. Alice and Bob are both woken; Alice's
# commit wins (Bob's gets 409 and is dropped) and she sends Carol the Welcome. Carol joins at
# the new epoch and cannot read anything earlier.
name = "g5-third-person-joins"
description = "Carol joins Alice and Bob's Meetup; one commit wins"
seed = 5

[party]
members = ["alice", "bob", "carol"]

[[party.spots]]
name = "anchor"
latitude = 51.5007
longitude = -0.1246
radius_m = 150

# Alice and Bob meet, as in G.4.
[[steps]]
at = 0
device = "alice"
fix = { spot = "anchor", position = "inside" }

[[steps]]
at = 0
device = "alice"
geofence = { region = "anchor", transition = "enter" }

[[steps]]
at = 30
device = "alice"
location = { spot = "anchor", position = "inside" }

[[steps]]
at = 120
device = "bob"
fix = { spot = "anchor", position = "inside" }

[[steps]]
at = 120
device = "bob"
geofence = { region = "anchor", transition = "enter" }

[[steps]]
at = 150
device = "bob"
location = { spot = "anchor", position = "inside" }

[[steps]]
at = 152
device = "alice"
fix = { spot = "anchor", position = "inside" }

[[steps]]
at = 152
device = "alice"
wake = "push"

[[steps]]
at = 155
device = "bob"
wake = "push"

# Carol arrives.
[[steps]]
at = 300
device = "carol"
fix = { spot = "anchor", position = "inside" }

[[steps]]
at = 300
device = "carol"
geofence = { region = "anchor", transition = "enter" }

[[steps]]
at = 330
device = "carol"
location = { spot = "anchor", position = "inside" }

# Her knocks wake both members.
[[steps]]
at = 332
device = "alice"
fix = { spot = "anchor", position = "inside" }

[[steps]]
at = 332
device = "alice"
wake = "push"

[[steps]]
at = 332
device = "bob"
fix = { spot = "anchor", position = "inside" }

[[steps]]
at = 332
device = "bob"
wake = "push"

# The Welcome reaches Carol.
[[steps]]
at = 335
device = "carol"
wake = "push"

[[steps]]
at = 336
device = "carol"
expect = { event = "meetup_started" }

[[steps]]
at = 336
device = "alice"
expect = { event = "meetup_updated" }

[[steps]]
at = 336
device = "bob"
expect = { event = "meetup_updated" }
