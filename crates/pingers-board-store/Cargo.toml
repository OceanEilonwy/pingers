[package]
name = "pingers-board-store"
description = "Server: board records, expiry, paging, segment hashes."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.pingers]
layer = 3

[dependencies]
# Segment hashes, revoke commitments and the cursor seal: only pingers-crypto calls primitives.
pingers-crypto = { workspace = true }
pingers-presence = { workspace = true, features = ["server"] }
pingers-proto = { workspace = true }
pingers-time = { workspace = true }
rand_core = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
pingers-testkit = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
