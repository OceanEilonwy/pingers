[package]
name = "pingers-meetup"
description = "What happens inside a meetup: location consent, chat, meet point, compass (sans-IO)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.pingers]
layer = 1

[dependencies]
pingers-crypto = { workspace = true }
pingers-geo = { workspace = true }
pingers-proto = { workspace = true }
pingers-time = { workspace = true }
rand_core = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# X-Wing grant keys, for the traffic of quantum-resistant Meetups (design B.8).
pingers-crypto = { workspace = true, features = ["x-wing"] }
pingers-testkit = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
