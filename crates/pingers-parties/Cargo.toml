[package]
name = "pingers-parties"
description = "Party lifecycle: create, invite, join, roster, Spots."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.pingers]
layer = 3

[features]
# The X-Wing suite for quantum-resistant Parties (design B.8).
x-wing = ["pingers-mls/x-wing"]

[dependencies]
# Derivations and seals this crate names but does not implement: the join-request seal, state
# snapshots, account ids (inviter fingerprints and safety codes).
pingers-crypto = { workspace = true }
pingers-geo = { workspace = true }
pingers-mls = { workspace = true }
# `RosterLookup`, which this crate implements for knock verification, and `EpochTransition`.
pingers-presence = { workspace = true }
pingers-proto = { workspace = true }
pingers-store = { workspace = true }
pingers-time = { workspace = true }
rand_core = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
pingers-time = { workspace = true, features = ["test-util"] }
rand_chacha = { workspace = true }

[lints]
workspace = true
