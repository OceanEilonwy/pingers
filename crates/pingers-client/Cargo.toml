[package]
name = "pingers-client"
description = "Composition root: wires the client crates, no domain logic."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.pingers]
layer = 3

[dependencies]
async-trait = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
pingers-crypto = { workspace = true }
pingers-gate = { workspace = true }
pingers-geo = { workspace = true }
pingers-meetup = { workspace = true }
pingers-meetup-session = { workspace = true }
pingers-mls = { workspace = true }
pingers-ohttp = { workspace = true }
pingers-parties = { workspace = true }
pingers-presence = { workspace = true }
pingers-proto = { workspace = true }
pingers-store = { workspace = true }
pingers-sync = { workspace = true }
pingers-time = { workspace = true }
pingers-transport = { workspace = true }
pingers-wake = { workspace = true }
rand_core = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
pingers-time = { workspace = true, features = ["test-util"] }
rand_chacha = { workspace = true }
pingers-testkit = { workspace = true, features = ["client", "harness"] }
tokio = { workspace = true }

[lints]
workspace = true
