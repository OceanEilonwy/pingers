# One place for every dependency version: the same versions as the
# monokulo-fob app, already vetted and each released well before it was added.
[versions]
agp = "9.4.1"
kotlin = "2.4.20"
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
core-ktx = "1.19.1"
coroutines = "1.11.0"
lifecycle = "2.11.0"
jna = "5.19.1"
# Platform layer (org.pingers.app.platform). Each released at least two weeks before it was added.
# Play services location 21.4.0 of 2026-06-25.
play-services-location = "21.4.0"
# UnifiedPush's Android connector (Apache-2.0), 3.3.5 of 2026-08-22, as in monokular.
unifiedpush = "3.3.5"
# WorkManager 2.12.0 of 2026-09-23.
work = "2.12.0"
# FCM, gms flavour only: 26.0.1 of 2026-10-21.
firebase-messaging = "26.0.1"
junit = "4.13.2"
robolectric = "4.17"
androidx-test-core = "1.7.0"
androidx-test-ext-junit = "1.3.0"
androidx-test-runner = "1.7.0"
# MapLibre Native (OpenGL ES renderer), 15 Oct 2026: offline region packs through its
# pmtiles:// source (docs: android/docs/maps.md). No Google or Apple map SDK.
maplibre = "13.7.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "play-services-location" }
unifiedpush-connector = { module = "org.unifiedpush.android:connector", version.ref = "unifiedpush" }
work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging", version.ref = "firebase-messaging" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core-ktx", version.ref = "androidx-test-core" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit-ktx", version.ref = "androidx-test-ext-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
maplibre = { module = "org.maplibre.gl:android-sdk-opengl", version.ref = "maplibre" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
